# Feasibility envelope for the fixed 35.04 kg cart on flat ground.
schema_version: 4
joint_order:
  - left_hip_pitch_joint
  - left_hip_roll_joint
  - left_hip_yaw_joint
  - left_knee_joint
  - left_ankle_pitch_joint
  - left_ankle_roll_joint
  - right_hip_pitch_joint
  - right_hip_roll_joint
  - right_hip_yaw_joint
  - right_knee_joint
  - right_ankle_pitch_joint
  - right_ankle_roll_joint
  - waist_yaw_joint
  - waist_roll_joint
  - waist_pitch_joint
  - left_shoulder_pitch_joint
  - left_shoulder_roll_joint
  - left_shoulder_yaw_joint
  - left_elbow_joint
  - left_wrist_roll_joint
  - left_wrist_pitch_joint
  - left_wrist_yaw_joint
  - right_shoulder_pitch_joint
  - right_shoulder_roll_joint
  - right_shoulder_yaw_joint
  - right_elbow_joint
  - right_wrist_roll_joint
  - right_wrist_pitch_joint
  - right_wrist_yaw_joint
ranges:
  torso.mass_delta: {min: -1.0, max: 3.0}
  payload.mass: {min: -3.0, max: 3.0}
  payload.com.x: {min: 0.3, max: 0.9}
  payload.com.y: {min: -0.15, max: 0.15}
  payload.com.z: {min: 0.45, max: 0.95}
  rolling_resistance.c_rr: {min: 0.01, max: 0.03}
  terrain.friction: {min: 0.6, max: 1.1}
  wheel.left_damping: {min: 0.015, max: 0.025}
  wheel.right_damping: {min: 0.015, max: 0.025}
calibration:
  rickshaw.pitch_inertia_about_axle: 23.114540082188146
  rickshaw_pose.hitch_height_tolerance: 0.005
  rickshaw_pose.hitch_vertical_speed_tolerance: 0.02
  rolling_resistance.c_rr_nominal: 0.02
  terrain.friction_nominal: 1.0
  safety.minimum_wheel_normal_force: 25.0
  safety.overspeed_margin: 0.25
